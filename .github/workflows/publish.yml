name: Publish on 4pda

on:
  push:
    branches:
      - master
    paths:
      - '*.user.js'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Publish post on 4pda
        env:
          COOKIE: ${{ secrets.COOKIE_4PDA }}
          AUTH_KEY: ${{ secrets.AUTH_KEY_4PDA }}
          FORUM: 5
          TOPIC: 985927
        run: |
          chmod +x ./.github/publish.sh
          ./.github/publish.sh
        shell: bash
